<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>毕业生档案</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<nav class="navbar"><div class="nav-brand">毕业生档案</div><div class="nav-links"><a th:href="@{/admin/students}">学生管理</a><a th:href="@{/admin}">后台首页</a></div></nav>
<main class="container"><h2>毕业生历史档案</h2><form method="get"><input type="number" name="year" th:value="${year}" placeholder="毕业年份"><button class="btn btn-primary" type="submit">查询</button><a class="btn btn-outline" th:href="@{/admin/students/graduated}">全部年份</a></form>
<table class="table"><thead><tr><th>毕业年份</th><th>学号</th><th>姓名</th><th>性别</th><th>原年级</th><th>原班级</th><th>归档日期</th></tr></thead><tbody><tr th:each="a : ${archives}"><td th:text="${a.graduationYear}"></td><td th:text="${a.student.studentNo}"></td><td th:text="${a.student.name}"></td><td th:text="${a.student.gender}"></td><td th:text="${a.gradeName}"></td><td th:text="${a.className}"></td><td th:text="${a.archivedAt}"></td></tr><tr th:if="${#lists.isEmpty(archives)}"><td colspan="7">暂无毕业生档案</td></tr></tbody></table></main></body></html>
